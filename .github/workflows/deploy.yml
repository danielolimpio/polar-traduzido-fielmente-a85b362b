name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Validar JSON-LD (SEO / Rich Results)
        run: npm test

      - name: Build do projeto
        run: npm run build

      - name: Pré-renderizar rotas para SEO (Google Search Console)
        run: node scripts/prerender.mjs

      - name: Injetar preload da imagem LCP (Core Web Vitals)
        run: node scripts/inject-lcp-preload.mjs

      - name: Gerar arquivo de validação IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/generate-indexnow-key.mjs

      - name: Mostrar arquivos gerados
        run: ls -la dist/

      - name: Deploy para Hostinger via SFTP/FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT || '65002' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'sftp' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$FTP_PORT" -H "$FTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "$FTP_PROTOCOL://$FTP_HOST" <<EOF
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set sftp:auto-confirm yes
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --parallel=2 ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF

      - name: Notificar motores de busca (IndexNow + Bing)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/notify-search-engines.mjs
