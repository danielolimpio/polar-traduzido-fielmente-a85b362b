name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Validar JSON-LD (SEO / Rich Results)
        run: npm test

      - name: Build do projeto
        run: npm run build

      - name: Pré-renderizar rotas para SEO (Google Search Console)
        run: node scripts/prerender.mjs

      - name: Injetar preload da imagem LCP (Core Web Vitals)
        run: node scripts/inject-lcp-preload.mjs

      - name: Gerar arquivo de validação IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/generate-indexnow-key.mjs

      - name: Mostrar arquivos gerados
        run: ls -la dist/

      - name: Deploy para Hostinger via SFTP/FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || '/' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          deploy_attempt() {
            protocol="$1"
            port="$2"
            if [ "$protocol" = "sftp" ]; then
              mkdir -p ~/.ssh
              ssh-keyscan -p "$port" -H "$FTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
              chmod 600 ~/.ssh/known_hosts
            fi
            lftp -u "$FTP_USER","$FTP_PASS" -p "$port" "$protocol://$FTP_HOST" <<EOF
          set net:timeout 25
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set sftp:auto-confirm yes
          set ftp:ssl-allow true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --parallel=1 ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF
          }
          if [ -n "$FTP_PROTOCOL" ] && [ -n "$FTP_PORT" ]; then
            deploy_attempt "$FTP_PROTOCOL" "$FTP_PORT"
          else
            deploy_attempt sftp 65002 || deploy_attempt ftps 21 || deploy_attempt ftp 21
          fi

      - name: Notificar motores de busca (IndexNow + Bing)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/notify-search-engines.mjs
